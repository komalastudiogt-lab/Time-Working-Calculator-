name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Preparar Capacitor y Entorno Web
        run: |
          mkdir www
          cp index.html www/
          cp -r css www/
          cp -r js www/
          
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/assets@latest @capacitor/filesystem@latest @capacitor/share@latest
          
          npx cap init "Calculator Working Time" "com.calculatorworkingtime.app" --web-dir www
          npx cap add android
          
          mkdir -p assets
          if [ -f "icon.png" ]; then
            mv icon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi

          npx cap sync android

      - name: Compilar el APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorWorkingTime-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
